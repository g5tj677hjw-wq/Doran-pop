try{
 const saved=JSON.parse(localStorage.getItem('doran-pop-zh-cache')||'{}');
 Object.entries(saved).forEach(([key,value])=>chineseCache.set(key,value));
}catch{}

async function requestChineseTranslation(original){
 if(reviewedChinese[original])return reviewedChinese[original];
 if(chineseCache.has(original))return chineseCache.get(original);
 const endpoint='https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=zh-CN&dt=t&q='+encodeURIComponent(original);
 const response=await fetch(endpoint);
 if(!response.ok)throw new Error('Translation service unavailable');
 const data=await response.json();
 const translated=Array.isArray(data?.[0])?data[0].map(part=>part?.[0]||'').join('').trim():'';
 if(!translated)throw new Error('Empty translation');
 chineseCache.set(original,translated);
 try{
  localStorage.setItem('doran-pop-zh-cache',JSON.stringify(Object.fromEntries([...chineseCache.entries()].slice(-1000))));
 }catch{}
 return translated;
}
function watchTranslations(){
 translationObserver?.disconnect();
 if(!chineseEnabled)return;
 const run=translationRun;
 translationObserver=new IntersectionObserver(entries=>{
  for(const entry of entries){
   if(!entry.isIntersecting)continue;
   translationObserver.unobserve(entry.target);
   translateBubble(entry.target,run);
  }
 },{root:$('#chat'),rootMargin:'120px 0px'});
 for(const bubble of $('#chat').querySelectorAll('.bubble:not(.reply), .reply .answer > span:last-child')){
  if(!bubble.querySelector('.chinese-translation'))translationObserver.observe(bubble);
 }
}
async function translateBubble(bubble,run){
 const original=bubble.dataset.original||bubble.textContent.trim();
 if(!original||!/[가-힣]/.test(original))return;
 try{
  const translated=await requestChineseTranslation(original);
  const text=personalize(translated.replaceAll('{名字}',name));
  if(!chineseEnabled||translationRun!==run||!bubble.isConnected||!text||text===original)return;
  const chinese=el('span','chinese-translation',text);
  chinese.lang='zh-CN';
  bubble.append(chinese);
 }catch{
  translationStatus.textContent='部分消息暂时无法翻译，请检查网络后重试。';
 }
}
translationButton.onclick=async()=>{
 if(chineseEnabled){
  chineseEnabled=false;
  translationRun++;
  translationObserver?.disconnect();
  document.querySelectorAll('.chinese-translation').forEach(node=>node.remove());
  translationButton.setAttribute('aria-pressed','false');
  translationButton.textContent='开启中文翻译';
  translationStatus.textContent='';
  return;
 }
 translationButton.disabled=true;
 translationStatus.textContent='正在连接在线翻译服务…';
 try{
  await requestChineseTranslation('안녕하세요');
  chineseEnabled=true;
  translationRun++;
  translationButton.setAttribute('aria-pressed','true');
  translationButton.textContent='关闭中文翻译';
  translationStatus.textContent='中文翻译已开启：优先显示校对译文，其余内容联网翻译；韩文原文会完整保留。';
  watchTranslations();
  $('#translation').close();
 }catch{
  translationStatus.textContent='暂时无法连接翻译服务，请检查网络后重试。';
 }finally{
  translationButton.disabled=false;
 }
};

function readLocal(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}
}
function writeLocal(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}catch{}
}
const storedHearts=readLocal('pop-hearts-v1',[]);
const hearts=new Set(Array.isArray(storedHearts)?storedHearts:[]);
const storedReplies=readLocal('pop-anniversary-replies-v1',{});
const anniversaryReplies=storedReplies&&typeof storedReplies==='object'&&!Array.isArray(storedReplies)?storedReplies:{};
const heartEntries=new Map();
const heartKeys=groups.map(([date,rows],dayIndex)=>{
 const occurrences=new Map();
 return rows.map(([time,parts],rowIndex)=>{
  const occurrence=occurrences.get(time)||0;
  occurrences.set(time,occurrence+1);
  return parts.map((part,partIndex)=>{
   const key=JSON.stringify([parseDate(date),time,occurrence,partIndex]);
   heartEntries.set(key,{date,time,part,partIndex,dayIndex,rowIndex});
   return key;
  });
 });
});
function setHeartAppearance(button,key){
 const saved=hearts.has(key);
 button.textContent=saved?'♥':'♡';
 button.setAttribute('aria-pressed',String(saved));
 button.setAttribute('aria-label',saved?'取消收藏':'收藏这条消息');
}
function heartButton(key){
 const button=el('button','heart-toggle');
 button.type='button';
 button.dataset.heart=key;
 setHeartAppearance(button,key);
 button.onclick=()=>{
  if(hearts.has(key))hearts.delete(key);
  else hearts.add(key);
  writeLocal('pop-hearts-v1',[...hearts]);
  for(const item of document.querySelectorAll('.heart-toggle')){
   if(item.dataset.heart===key)setHeartAppearance(item,key);
  }
  if($('#heartDialog').open)renderHeartList();
 };
 return button;
}
function makeHeart(dayIndex,rowIndex,partIndex){
 return heartButton(heartKeys[dayIndex][rowIndex][partIndex]);
}
function renderHeartList(){
 const list=$('#heartList');
 list.replaceChildren();
 const entries=[...hearts].reverse().filter(key=>heartEntries.has(key));
 if(!entries.length){
  list.append(el('p','','点亮爱心的消息会收藏在这里。'));
  return;
 }
 for(const key of entries){
  const {date,time,part,dayIndex,rowIndex,partIndex}=heartEntries.get(key);
  const [kind,value,detail]=part;
  const row=el('div','heart-row');
  const button=el('button','search-result');
  const text=kind==='text'?personalize(value):kind==='reply'?personalize(detail):detail;
  button.append(el('small','',formatDateLabel(date)+' · '+formatTime(time)),el('span','heart-preview',text));
  if(kind==='photo'||kind==='sticker'){
   const thumbnail=el('img','heart-thumbnail');
   thumbnail.src=assets[value];
   thumbnail.alt='';
   thumbnail.loading='lazy';
   button.append(thumbnail);
  }
  button.onclick=()=>{
   enterChat(false);
   goToMessage(dayIndex,rowIndex,'',$('#heartDialog'),partIndex);
  };
  row.append(button,heartButton(key));
  list.append(row);
 }
}
function openHearts(){
 renderHeartList();
 $('#heartDialog').showModal();
}
function koreanDate(){
 return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function anniversaryDays(today){
 const [year]=today.split('-');
 return groups.flatMap(([date],index)=>{
  const iso=parseDate(date);
  return iso&&iso.slice(0,4)<year&&iso.slice(5)===today.slice(5)
   ?[{index,iso,age:Number(year)-Number(iso.slice(0,4))}]:[];
 }).reverse();
}
let anniversarySelection;
let homeDate='';
function showAnniversary(day){
 anniversarySelection=day;
 const title=$('#anniversaryTitle');
 title.textContent=day.age+' 年前的今天 · Doran';
 const body=$('#anniversaryMessages');
 const [date,rows]=groups[day.index];
 const separator=el('div','date');
 separator.append(el('span','',formatDateLabel(date)));
 body.replaceChildren(separator,...rows.map((_,i)=>makeMessageGroup(day.index,i)));
 for(const tab of $('#anniversaryYears').children){
  tab.setAttribute('aria-pressed',String(tab.dataset.iso===day.iso));
 }
 $('#anniversaryReply').value='';
 renderAnniversaryReplies();
}
function renderAnniversaryReplies(){
 const key=anniversarySelection.iso;
 const replies=Array.isArray(anniversaryReplies[key])?anniversaryReplies[key]:[];
 $('#anniversaryReplies').replaceChildren(...replies.map(text=>el('div','bubble local-reply',text)));
}
function refreshAnniversary(){
 homeDate=koreanDate();
 const available=anniversaryDays(homeDate);
 $('#onThisDay').hidden=!name||!available.length;
 anniversarySelection=undefined;
 if($('#onThisDay').hidden)return;
 const tabs=$('#anniversaryYears');
 tabs.replaceChildren();
 tabs.hidden=available.length<2;
 for(const day of available){
  const button=el('button','',day.age+' 年前');
  button.type='button';
  button.dataset.iso=day.iso;
  button.onclick=()=>showAnniversary(day);
  tabs.append(button);
 }
 showAnniversary(available[0]);
}
function saveNickname(value){
 name=value;
 try{localStorage.setItem('pop-name',name)}catch{}
}
function showHome(){
 $('#phone').hidden=true;
 $('#home').hidden=false;
 $('#name').value=name;
 refreshAnniversary();
}
let renderedName;
function enterChat(latest=true){
 $('#home').hidden=true;
 $('#phone').hidden=false;
 if(renderedName!==name){
  render();
  renderedName=name;
 }
 if(latest)requestAnimationFrame(scrollToLatest);
}
function initHome(){
 showHome();
 $('#goHome').onclick=showHome;
 $('#nameForm').onsubmit=event=>{
  event.preventDefault();
  const nickname=$('#name').value.trim();
  if(!nickname)return;
  saveNickname(nickname);
  enterChat();
 };
 $('#name').addEventListener('change',()=>{
  const nickname=$('#name').value.trim();
  if(nickname===name||!nickname)return;
  saveNickname(nickname);
  refreshAnniversary();
 });
 $('#homeHearts').onclick=openHearts;
 $('#openHearts').onclick=()=>{
  $('#settings').close();
  openHearts();
 };
 $('#anniversaryForm').onsubmit=event=>{
  event.preventDefault();
  if(koreanDate()!==homeDate){refreshAnniversary();return}
  if(!anniversarySelection)return;
  const text=$('#anniversaryReply').value.trim();
  if(!text)return;
  const key=anniversarySelection.iso;
  const previous=Array.isArray(anniversaryReplies[key])?anniversaryReplies[key]:[];
  anniversaryReplies[key]=[...previous,text];
  writeLocal('pop-anniversary-replies-v1',anniversaryReplies);
  renderAnniversaryReplies();
  $('#anniversaryReply').value='';
 };
 document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!$('#home').hidden&&koreanDate()!==homeDate)refreshAnniversary();
 });
 window.setInterval(()=>{
  if(!$('#home').hidden&&koreanDate()!==homeDate)refreshAnniversary();
 },60000);
}

if('scrollRestoration' in history)history.scrollRestoration='manual';
initHome();
